name: Android current APK blackbox smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-app-smoke.yml
      - scripts/android-app-smoke.mjs
      - scripts/android-app-smoke.test.mjs
      - scripts/android-app-smoke-fixtures/**
  workflow_dispatch:
    inputs:
      apk_asset_id:
        description: Immutable APK asset ID in this repository
        required: true
        type: string
      apk_sha256:
        description: Exact APK SHA-256
        required: true
        type: string
      build_info_asset_id:
        description: Immutable build-info.json asset ID in this repository
        required: true
        type: string
      build_info_sha256:
        description: Exact raw build-info.json SHA-256
        required: true
        type: string
      app_source_commit:
        description: Exact private application source commit (40 hex)
        required: true
        type: string

permissions: {}

concurrency:
  group: android-app-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-compile:
    name: Public source checks and actual synthetic helper compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Fetch exact public source without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          test "$GITHUB_REPOSITORY" = "anymize-GmbH/downloads"
          git init .
          git -c credential.helper= -c core.askPass= -c protocol.file.allow=never fetch --no-tags --depth=1 https://github.com/anymize-GmbH/downloads.git "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Test public source and unchanged OS failure controls
        run: node --test scripts/emulator-baseline.test.mjs scripts/android-app-smoke.test.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install actual fixture compiler without an emulator or private input
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: platforms;android-35 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - name: Compile and verify the actual public synthetic helper APK
        run: node scripts/android-app-smoke.mjs --compile-helper
      - name: Preserve actual public compiler and package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-public-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/android-app-smoke/helper-compile-*.json
            artifacts/android-app-smoke/helper-compile-*.txt
            artifacts/android-app-smoke/helper-compile-certificate.der
            artifacts/android-app-smoke/fixture-source.json
            artifacts/android-app-smoke/synthetic-fixture.apk
          if-no-files-found: warn
          retention-days: 14

  app-smoke:
    name: Current APK on actual Android API ${{ matrix.api }}
    if: github.event_name == 'workflow_dispatch'
    needs: source-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '35'
            sdk: '35'
            image: google_apis
            pages: '4096'
          - api: '36'
            sdk: '36'
            image: google_apis_ps16k
            pages: '16384'
          - api: '37'
            sdk: '37.0'
            image: google_apis_ps16k
            pages: '16384'
    env:
      EXPECTED_API: ${{ matrix.api }}
      EXPECTED_PAGE_SIZE: ${{ matrix.pages }}
      EXPECTED_IMAGE: ${{ matrix.image }}
      APK_ASSET_ID: ${{ inputs.apk_asset_id }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
      BUILD_INFO_ASSET_ID: ${{ inputs.build_info_asset_id }}
      BUILD_INFO_SHA256: ${{ inputs.build_info_sha256 }}
      APP_SOURCE_COMMIT: ${{ inputs.app_source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Check unchanged OS oracles and blackbox failure controls
        run: node --test scripts/emulator-baseline.test.mjs scripts/android-app-smoke.test.mjs
      - name: Fetch exact current APK and independently hashed build metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/android-app-smoke.mjs --fetch
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install actual emulator and synthetic fixture compiler
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools emulator platforms;android-35 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - name: Bind exact modern command tools for the emulator action
        run: node scripts/emulator-baseline.mjs --pin-command-tools
      - name: Build public synthetic read-only content URI fixture helper
        run: node scripts/android-app-smoke.mjs --build-fixture
      - name: Record actual host and enable disposable KVM
        run: |
          mkdir -p artifacts/baseline
          lscpu > artifacts/baseline/host-cpu.txt
          free -b > artifacts/baseline/host-memory.txt
          df -k > artifacts/baseline/host-disk.txt
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check > artifacts/baseline/host-acceleration.txt 2>&1
      - name: Real unchanged OS proof then current APK blackbox operations
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.sdk }}
          target: ${{ matrix.image }}
          arch: x86_64
          profile: pixel
          force-avd-creation: true
          disk-size: '8G'
          ram-size: '6144M'
          cores: 4
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -accel on -no-snapshot -noaudio -camera-back none -no-metrics -skin 720x1280 -dpi-device 320
          script: |
            node scripts/emulator-baseline.mjs
            node scripts/android-app-smoke.mjs --run
      - name: Preserve real OS baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-app-os-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/baseline/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve only synthetic APK operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-app-smoke-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/android-app-smoke/*.json
            artifacts/android-app-smoke/*.txt
            artifacts/android-app-smoke/*.png
            artifacts/android-app-smoke/*.xml
            artifacts/android-app-smoke/saved-copy.pdf
          if-no-files-found: warn
          retention-days: 14
